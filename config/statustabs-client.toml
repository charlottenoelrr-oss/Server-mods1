#Tab definitions. Format: id;label;keyMatch;screenMatch;colorRRGGBB
#keyMatch / screenMatch: '&' = AND, '|' = OR, case-insensitive substring match.
#keyMatch is compared with the internal key mapping name (see /statustabs keys).
#screenMatch is compared with the full class name of the screen (see /statustabs debug).
#The tab with id 'inventory' opens the vanilla inventory screen directly.
tabs = ["inventory;ステータス;inventory;inventoryscreen;5AA0FF", "magic;MagicLevel;puffish;puffish&skillsscreen;B07CFF", "battle;BattleSkill;epicfight_skills;epicfight&skilleditscreen;E8604C", "world;WorldLevel;apotheosis_tier;apotheosis&worldtier;F2C14E"]
#Show tabs whose key mapping could not be found (greyed out).
showMissingTabs = true
#Show the class name of the current screen at the bottom-left corner (for finding screenMatch values).
debugOverlay = false
#Where to draw the tab bar.
#Allowed Values: TOP, BOTTOM
barPosition = "TOP"
#Horizontal offset of the tab bar in pixels.
# Default: 0
# Range: -1000 ~ 1000
offsetX = 0
#Vertical offset of the tab bar in pixels.
# Default: 0
# Range: -1000 ~ 1000
offsetY = 0
